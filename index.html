<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Is It a Cat?</title>
<meta name="description" content="Point your camera at anything and find out: is it a cat? Green check yes, red X no, question mark for kinda-looks-like-a-cat.">
<meta property="og:title" content="Is It a Cat?">
<meta property="og:description" content="Point your camera at anything and find out if it's a cat.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://goldenratiowindow.vercel.app">
<meta name="theme-color" content="#0c0a08">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0c0a08;--panel:#16130f;--line:#2a2419;
    --gold:#d4a13a;--gold-bright:#f0c14b;--ink:#ece4d4;--dim:#8a8170;
    --green:#5fb47a;--green-bright:#7fe0a0;--red:#c5604f;--red-bright:#e87a68;--amber:#e6b23c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);font-family:'Spline Sans Mono',monospace;
    display:flex;flex-direction:column;
    background-image:radial-gradient(circle at 30% 0%,#1a1610 0%,transparent 55%);
  }

  #capture{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stageWrap{position:relative;max-width:100%;max-height:100%}
  #view{position:relative;display:block;border-radius:8px;overflow:hidden;background:#000}
  video{display:block;max-width:100%;max-height:78vh}
  canvas#box{position:absolute;top:0;left:0;pointer-events:none}

  /* big verdict badge, always in frame for screenshots */
  #badge{
    position:absolute;top:14px;left:14px;z-index:5;
    background:rgba(12,10,8,.72);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:14px;padding:12px 18px;
    display:flex;align-items:center;gap:14px;transition:border-color .2s;
  }
  #badgeIcon{font-size:44px;line-height:1;width:50px;text-align:center}
  #badgeTxt{display:flex;flex-direction:column;gap:2px}
  #badgeVerdict{font-family:'Fraunces',serif;font-weight:900;font-size:22px;line-height:1}
  #badgeSub{font-size:12px;color:var(--dim)}
  #wm{position:absolute;bottom:12px;right:14px;z-index:5;font-size:11px;color:rgba(236,228,212,.55);letter-spacing:.04em}
  #wm b{color:var(--gold-bright)}

  #bar{
    flex:none;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;gap:12px;
  }
  .title{display:flex;align-items:baseline;gap:10px;justify-content:center}
  .title h1{font-family:'Fraunces',serif;font-weight:900;font-size:22px;color:var(--gold-bright)}
  .title span{font-size:11px;color:var(--dim)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{
    background:#1f1a12;border:1px solid var(--line);color:var(--ink);
    font-family:'Spline Sans Mono',monospace;font-size:13px;font-weight:500;
    padding:12px 16px;border-radius:8px;cursor:pointer;transition:.12s;flex:1;min-width:120px;
  }
  button:hover{border-color:var(--gold)}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--gold);color:#0c0a08;border-color:var(--gold);font-weight:600}
  button.primary:hover{background:var(--gold-bright)}
  #hint{text-align:center;font-size:12px;color:var(--dim);line-height:1.5;padding:0 8px}
  #err{text-align:center;font-size:12px;color:var(--red-bright);line-height:1.5}
  #shopBtn{display:block;text-align:center;text-decoration:none;
    background:linear-gradient(90deg,#d4a13a,#f0c14b);color:#0c0a08;font-weight:700;
    font-family:'Spline Sans Mono',monospace;font-size:14px;padding:13px 16px;border-radius:10px;
    border:1px solid var(--gold);letter-spacing:.02em;}
  #shopBtn:hover{filter:brightness(1.08)}
  #shopBtn.hot{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,193,75,.55)}50%{box-shadow:0 0 0 9px rgba(240,193,75,0)}}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="capture">
  <div id="stageWrap">
    <div id="view">
      <video id="video" playsinline muted></video>
      <canvas id="box"></canvas>
    </div>
    <div id="badge">
      <div id="badgeIcon">🐱</div>
      <div id="badgeTxt"><span id="badgeVerdict">Is it a cat?</span><span id="badgeSub">tap start</span></div>
    </div>
    <div id="wm"><b>cat?</b> goldenratiowindow.vercel.app</div>
  </div>
</div>

<div id="bar">
  <div class="title"><h1 id="appTitle">Is It a Cat?</h1><span>point &amp; find out</span></div>
  <div class="btns" id="modes" style="gap:6px">
    <button id="modeCat" class="primary" style="min-width:0">Is it a cat?</button>
    <button id="modeHC" style="min-width:0">Human or cat?</button>
    <button id="modeBurger" style="min-width:0">Is it a burger?</button>
    <button id="modeSkeptic" style="min-width:0">Skeptic detector</button>
  </div>
  <div class="btns" id="preBtns">
    <button class="primary" id="start">Start camera</button>
  </div>
  <div class="btns hidden" id="liveBtns">
    <button id="freezeBtn">Freeze</button>
    <button id="flipBtn">Flip cam</button>
    <button id="shotBtn" class="primary">📸 Save shot</button>
  </div>
  <div id="hint">Use the toggle to switch modes. "Is it a cat?" gives a green check / red X verdict. "Human or cat?" tells you which one it's looking at. First scan loads the detector, give it a few seconds.</div>
  <div id="err"></div>
  <a id="shopBtn" href="#" target="_blank" rel="noopener">🛒 Shop cat toys</a>
</div>

<script>
const video=document.getElementById('video');
const box=document.getElementById('box');
const bctx=box.getContext('2d');
const view=document.getElementById('view');
const badge=document.getElementById('badge');
const icon=document.getElementById('badgeIcon');
const verdict=document.getElementById('badgeVerdict');
const sub=document.getElementById('badgeSub');

// classes that "kind of look like a cat" if no real cat is found
const CATLIKE=new Set(['dog','teddy bear','bear','mouse','sheep','horse','cow']);
// COCO-SSD has no "hamburger" class, so burger mode rides its real food classes.
// at a burger restaurant the plate reliably trips one of these.
const BURGERLIKE=new Set(['sandwich','hot dog','pizza','donut','cake','bowl']);

let facing='environment',stream=null,model=null;
let mode='cat'; // 'cat' or 'humancat'
// cat toys link + share-shot watermark. To actually earn, append your affiliate
// tag to TOYS_URL, e.g. ...&tag=YOURTAG-20 (Amazon Associates) and update the label.
const TOYS_URL="https://www.amazon.com/s?k=cat+toys";
const TOYS_LABEL="shop cat toys · amazon.com";
let frozen=false,running=false,detecting=false;
let vw=0,vh=0,dispW=0,dispH=0;
let lastVerdict={state:'none',label:'',score:0,bbox:null};

document.getElementById('start').onclick=initCam;

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadModel(){
  if(model)return model;
  sub.textContent='loading detector…';
  if(typeof cocoSsd==='undefined'){
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
  }
  model=await cocoSsd.load({base:'mobilenet_v2'});
  return model;
}

async function initCam(){
  document.getElementById('err').textContent='';
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream;await video.play();
    vw=video.videoWidth;vh=video.videoHeight;
    sizeStage();
    document.getElementById('preBtns').classList.add('hidden');
    document.getElementById('liveBtns').classList.remove('hidden');
    running=true;
    await loadModel();
    sub.textContent='scanning…';
    detectLoop();
  }catch(e){
    document.getElementById('err').textContent='Camera unavailable: '+e.name+'. Open in a full browser tab. Camera needs HTTPS + permission.';
  }
}

function sizeStage(){
  const r=video.getBoundingClientRect();
  dispW=r.width;dispH=r.height;
  box.width=vw;box.height=vh;
  box.style.width=dispW+'px';box.style.height=dispH+'px';
}
window.addEventListener('resize',()=>{if(running)sizeStage();});

// offscreen canvases for tiled detection
const feedCv=document.createElement('canvas');
const fctx=feedCv.getContext('2d',{willReadFrequently:true});
const workCv=document.createElement('canvas');
const wctx=workCv.getContext('2d',{willReadFrequently:true});

// rotating crop regions [x,y,w,h] as fractions of the frame.
// each cycle scans the full frame PLUS one of these, so small/off-center
// subjects fill more of the detector's fixed input over a ~1s sweep.
const CROPS=[
  [0.20,0.20,0.60,0.60], // center
  [0.00,0.00,0.58,0.58], // top-left
  [0.42,0.00,0.58,0.58], // top-right
  [0.00,0.42,0.58,0.58], // bottom-left
  [0.42,0.42,0.58,0.58], // bottom-right
];
let cropIdx=0;
let hits=[]; // recent detections pooled across regions: {class,score,bbox,t}
const MEM=1500; // ms to remember a detection

async function detectRegion(sx,sy,sw,sh){
  sx=Math.round(sx);sy=Math.round(sy);
  sw=Math.max(8,Math.round(sw));sh=Math.max(8,Math.round(sh));
  workCv.width=sw;workCv.height=sh;
  wctx.drawImage(feedCv,sx,sy,sw,sh,0,0,sw,sh);
  const preds=await model.detect(workCv,20);
  return preds.map(p=>({class:p.class,score:p.score,
    bbox:[p.bbox[0]+sx,p.bbox[1]+sy,p.bbox[2],p.bbox[3]]}));
}

async function detectLoop(){
  if(!running)return;
  if(!frozen && model && video.readyState>=2 && !detecting){
    detecting=true;
    try{
      feedCv.width=vw;feedCv.height=vh;
      fctx.drawImage(video,0,0,vw,vh);
      let preds=await model.detect(feedCv,20);            // whole frame
      const c=CROPS[cropIdx];cropIdx=(cropIdx+1)%CROPS.length;
      preds=preds.concat(await detectRegion(c[0]*vw,c[1]*vh,c[2]*vw,c[3]*vh)); // one tile
      ingest(preds);
      evaluate();
    }catch(e){/* ignore transient frame errors */}
    detecting=false;
  }
  draw();
  setTimeout(detectLoop,100);
}

function ingest(preds){
  const t=performance.now();
  for(const p of preds){
    if(p.class==='cat'||p.class==='person'||CATLIKE.has(p.class)||BURGERLIKE.has(p.class)) hits.push({class:p.class,score:p.score,bbox:p.bbox,t});
  }
  hits=hits.filter(h=>t-h.t<MEM);
}

function evaluate(){
  const t=performance.now();
  hits=hits.filter(h=>t-h.t<MEM);
  if(mode==='humancat'){evalHumanCat();return;}
  if(mode==='burger'){evalBurger();return;}
  if(mode==='skeptic'){evalSkeptic();return;}
  let bestCat=null, bestDog=null, bestLike=null, catStrong=0;
  for(const h of hits){
    if(h.class==='cat'){ if(!bestCat||h.score>bestCat.score)bestCat=h; if(h.score>=0.50)catStrong++; }
    else if(h.class==='dog'){ if(!bestDog||h.score>bestDog.score)bestDog=h; }
    else if(!bestLike||h.score>bestLike.score)bestLike=h;
  }
  // a dog that scores as high as the cat means it's a dog, not a cat
  const dogBeatsCat = bestDog && (!bestCat || bestDog.score>=bestCat.score);
  // green check requires a strong, repeated cat detection, not one lucky frame.
  // kills flickery false positives (a pile of clothes that briefly reads as a cat).
  const solidCat = bestCat && bestCat.score>=0.60 && catStrong>=3 && !dogBeatsCat;
  let v;
  if(solidCat){
    v={state:'yes',label:'CAT',score:bestCat.score,bbox:bestCat.bbox};
  }else if(dogBeatsCat && bestDog.score>=0.40){
    v={state:'no',label:"that's a dog",score:bestDog.score,bbox:bestDog.bbox};
  }else if(bestCat && bestCat.score>=0.20){
    v={state:'maybe',label:'kinda looks like a cat',score:bestCat.score,bbox:bestCat.bbox};
  }else if(bestLike && bestLike.score>=0.55){
    v={state:'maybe',label:'more like a '+bestLike.class,score:bestLike.score,bbox:bestLike.bbox};
  }else{
    v={state:'no',label:'NOT a cat',score:0,bbox:null};
  }
  lastVerdict=v;
  setBadge(v);
}

function evalHumanCat(){
  let bestPerson=null,bestCat=null;
  for(const h of hits){
    if(h.class==='person'){ if(!bestPerson||h.score>bestPerson.score)bestPerson=h; }
    else if(h.class==='cat'){ if(!bestCat||h.score>bestCat.score)bestCat=h; }
  }
  const pOK=bestPerson&&bestPerson.score>=0.40;
  const cOK=bestCat&&bestCat.score>=0.40;
  let v;
  if(pOK && (!cOK || bestPerson.score>=bestCat.score)){
    v={state:'human',label:'Human',score:bestPerson.score,bbox:bestPerson.bbox};
  }else if(cOK){
    v={state:'catwin',label:'Cat',score:bestCat.score,bbox:bestCat.bbox};
  }else{
    v={state:'idle',label:'',score:0,bbox:null};
  }
  lastVerdict=v;
  setBadge(v);
}

function evalBurger(){
  // COCO has no hamburger; pool its food classes. "sandwich" is the strongest
  // burger proxy, the rest count at a lower bar. require a repeated hit so a
  // single lucky frame doesn't trigger.
  let best=null, strong=0;
  for(const h of hits){
    if(BURGERLIKE.has(h.class)){
      if(!best||h.score>best.score)best=h;
      if(h.score>=0.45)strong++;
    }
  }
  let v;
  if(best && best.score>=0.55 && strong>=2){
    v={state:'burger',label:'BURGER',score:best.score,bbox:best.bbox,via:best.class};
  }else if(best && best.score>=0.30){
    v={state:'maybeburger',label:'kinda burger-shaped',score:best.score,bbox:best.bbox,via:best.class};
  }else{
    v={state:'noburger',label:'NOT a burger',score:0,bbox:null};
  }
  lastVerdict=v;
  setBadge(v);
}

function evalSkeptic(){
  // pure face/person presence. any confident person is a skeptic.
  let best=null;
  for(const h of hits){
    if(h.class==='person'){ if(!best||h.score>best.score)best=h; }
  }
  let v;
  if(best && best.score>=0.45){
    v={state:'skeptic',label:'SKEPTIC DETECTED',score:best.score,bbox:best.bbox};
  }else{
    v={state:'noskeptic',label:'no skeptics in frame',score:0,bbox:null};
  }
  lastVerdict=v;
  setBadge(v);
}

function setBadge(v){
  let ic,txt,col,sb;
  if(v.state==='human'){ic='🧑';txt='Human';col='#6fa8dc';sb='that is a person  ·  '+Math.round(v.score*100)+'%';}
  else if(v.state==='catwin'){ic='🐱';txt='Cat';col='var(--green-bright)';sb='that is a cat  ·  '+Math.round(v.score*100)+'%';}
  else if(v.state==='idle'){ic='❓';txt='—';col='var(--dim)';sb='point at a person or a cat';}
  else if(v.state==='yes'){ic='✅';txt='Cat';col='var(--green-bright)';sb='yep, that is a cat  ·  '+Math.round(v.score*100)+'%';}
  else if(v.state==='maybe'){ic='❓';txt='Maybe?';col='var(--amber)';sb=v.label+'  ·  '+Math.round(v.score*100)+'%';}
  else if(v.state==='burger'){ic='🍔';txt='BURGER';col='var(--green-bright)';sb='confirmed burger  ·  '+Math.round(v.score*100)+'% (via '+v.via+')';}
  else if(v.state==='maybeburger'){ic='❓';txt='Maybe?';col='var(--amber)';sb=v.label+'  ·  '+Math.round(v.score*100)+'%';}
  else if(v.state==='noburger'){ic='❌';txt='Not a burger';col='var(--red-bright)';sb='no burger detected';}
  else if(v.state==='skeptic'){ic='🧐';txt='SKEPTIC';col='var(--red-bright)';sb='this person doubts the app  ·  '+Math.round(v.score*100)+'%';}
  else if(v.state==='noskeptic'){ic='👀';txt='—';col='var(--dim)';sb='no skeptics in frame';}
  else{ic='❌';txt='Not a cat';col='var(--red-bright)';sb=(v.label && v.label!=='NOT a cat')?v.label+'  ·  '+Math.round(v.score*100)+'%':'no cat detected';}
  icon.textContent=ic;
  verdict.textContent=txt;verdict.style.color=col;
  sub.textContent=sb;
  badge.style.borderColor=col;
  // nudge the shop button when there's a cat in frame
  const sBtn=document.getElementById('shopBtn');
  if(sBtn) sBtn.classList.toggle('hot', v.state==='yes'||v.state==='catwin');
}

function draw(){
  bctx.clearRect(0,0,vw,vh);
  const b=lastVerdict.bbox;
  if(!b)return;
  let col;
  if(lastVerdict.state==='yes'||lastVerdict.state==='catwin'||lastVerdict.state==='burger')col='#7fe0a0';
  else if(lastVerdict.state==='human')col='#6fa8dc';
  else if(lastVerdict.state==='maybe'||lastVerdict.state==='maybeburger')col='#e6b23c';
  else if(lastVerdict.state==='skeptic')col='#e87a68';
  else col='#e87a68';
  bctx.strokeStyle=col;bctx.lineWidth=Math.max(3,vw/220);
  bctx.strokeRect(b[0],b[1],b[2],b[3]);
}

// ---- screenshot: composite feed + box + verdict into one PNG ----
function saveShot(){
  const out=document.createElement('canvas');
  out.width=vw;out.height=vh;const o=out.getContext('2d');
  o.drawImage(video,0,0,vw,vh);
  o.drawImage(box,0,0,vw,vh);
  const s=vw/700; o.save();
  o.fillStyle='rgba(12,10,8,.72)';
  roundRect(o,20*s,20*s,300*s,96*s,16*s);o.fill();
  o.font=`${52*s}px serif`;o.textAlign='left';o.textBaseline='middle';
  const st=lastVerdict.state;
  const ic=st==='yes'?'✅':st==='catwin'?'🐱':st==='human'?'🧑':st==='burger'?'🍔':st==='skeptic'?'🧐':st==='maybe'?'❓':st==='maybeburger'?'❓':st==='idle'?'❓':st==='noskeptic'?'👀':'❌';
  o.fillText(ic, 34*s, 68*s);
  let txt,col;
  if(st==='yes'){txt='Cat';col='#7fe0a0';}
  else if(st==='catwin'){txt='Cat';col='#7fe0a0';}
  else if(st==='human'){txt='Human';col='#6fa8dc';}
  else if(st==='burger'){txt='BURGER';col='#7fe0a0';}
  else if(st==='maybeburger'){txt='Maybe?';col='#e6b23c';}
  else if(st==='noburger'){txt='Not a burger';col='#e87a68';}
  else if(st==='skeptic'){txt='SKEPTIC';col='#e87a68';}
  else if(st==='noskeptic'){txt='—';col='#8a8170';}
  else if(st==='maybe'){txt='Maybe?';col='#e6b23c';}
  else if(st==='idle'){txt='—';col='#8a8170';}
  else{txt='Not a cat';col='#e87a68';}
  o.fillStyle=col;o.font=`900 ${34*s}px Fraunces, serif`;
  o.fillText(txt, 96*s, 56*s);
  o.fillStyle='rgba(236,228,212,.8)';o.font=`${15*s}px monospace`;
  o.fillText(Math.round(lastVerdict.score*100)+'%', 96*s, 84*s);
  o.fillStyle='rgba(240,193,75,.92)';o.font=`${18*s}px monospace`;
  o.textAlign='right';o.fillText('🛒 '+TOYS_LABEL, vw-24*s, vh-24*s);
  o.fillStyle='rgba(236,228,212,.55)';o.font=`${13*s}px monospace`;
  o.fillText('goldenratiowindow.vercel.app', vw-24*s, vh-44*s);
  o.restore();
  out.toBlob(b=>{
    const url=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=url;a.download='is-it-a-cat-'+lastVerdict.state+'.png';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  },'image/png');
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

document.getElementById('freezeBtn').onclick=function(){frozen=!frozen;if(frozen){video.pause();}else{video.play();}this.textContent=frozen?'Unfreeze':'Freeze';};
document.getElementById('flipBtn').onclick=()=>{facing=facing==='environment'?'user':'environment';if(running)initCam();};
document.getElementById('shotBtn').onclick=saveShot;

function setMode(m){
  mode=m;
  document.getElementById('modeCat').classList.toggle('primary',m==='cat');
  document.getElementById('modeHC').classList.toggle('primary',m==='humancat');
  document.getElementById('modeBurger').classList.toggle('primary',m==='burger');
  document.getElementById('modeSkeptic').classList.toggle('primary',m==='skeptic');
  const titles={cat:'Is It a Cat?',humancat:'Human or Cat?',burger:'Is It a Burger?',skeptic:'Skeptic Detector'};
  document.getElementById('appTitle').textContent=titles[m];
  hits=[];
  const idle={cat:{state:'no'},humancat:{state:'idle'},burger:{state:'noburger'},skeptic:{state:'noskeptic'}};
  lastVerdict=Object.assign({label:'',score:0,bbox:null},idle[m]);
  setBadge(lastVerdict);
}
document.getElementById('modeCat').onclick=()=>setMode('cat');
document.getElementById('modeHC').onclick=()=>setMode('humancat');
document.getElementById('modeBurger').onclick=()=>setMode('burger');
document.getElementById('modeSkeptic').onclick=()=>setMode('skeptic');

// wire the cat-toys link
const shopBtn=document.getElementById('shopBtn');
shopBtn.href=TOYS_URL;

// service worker intentionally not registered: the TWA/Play build does not need it,
// and it interferes with PWABuilder's analyzer. Any previously installed SW is cleared below.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
</script>
